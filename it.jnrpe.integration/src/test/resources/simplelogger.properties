# SLF4J Simple Logger configuration for integration tests
# Set default log level to WARN to reduce noise in tests
org.slf4j.simpleLogger.defaultLogLevel=warn

# Show short log name
org.slf4j.simpleLogger.showShortLogName=true

# Show thread name
org.slf4j.simpleLogger.showThreadName=false

# Show date and time
org.slf4j.simpleLogger.showDateTime=true

# Date time format
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss

# Log to System.err
org.slf4j.simpleLogger.logFile=System.err

# Specific loggers for integration tests
org.slf4j.simpleLogger.log.it.jnrpe=info
org.slf4j.simpleLogger.log.io.netty=error
org.slf4j.simpleLogger.log.org.testcontainers=warn
org.slf4j.simpleLogger.log.com.github.dockerjava=error

# Reduce noise from Docker/Testcontainers
org.slf4j.simpleLogger.log.com.github.dockerjava.core.command=error
org.slf4j.simpleLogger.log.com.github.dockerjava.core.exec=error
org.slf4j.simpleLogger.log.org.testcontainers.dockerclient=error
org.slf4j.simpleLogger.log.org.testcontainers.shaded=error

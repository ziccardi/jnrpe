# Testcontainers configuration for ARM64/Apple Silicon compatibility
# Disable Ryuk to avoid ARM64 compatibility issues
testcontainers.ryuk.disabled=true

# Increase startup timeout for slower container startup on ARM64
testcontainers.startup.timeout=300

# Use Docker socket directly for better ARM64 compatibility
docker.client.strategy=org.testcontainers.dockerclient.UnixSocketClientProviderStrategy

# Reuse containers to speed up tests
testcontainers.reuse.enable=true
